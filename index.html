<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>保护环境 · 从我做起</title>
    <style>
        body {
            margin: 0;
            font-family: "微软雅黑", Arial, sans-serif;
            background-color: #f0f8f5;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        main {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        section {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        section h2 {
            color: #27ae60;
            margin-top: 0;
        }

        ul {
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #1e8449;
        }

        footer {
            background-color: #2c3e50;
            color: #ccc;
            text-align: center;

<header>
    <h1>保护环境 · 从我做起</h1>

<main>
    <section>
        <h2>为什么要保护环境？</h2>
        <p>
            环境是人类生存的基础。空气污染、水资源短缺、气候变化等问题，
            正在威胁我们的健康和未来。保护环境，就是保护我们自己。
        </p>
    </section>

    <section>
        <h2>我们能做些什么？</h2>
        <ul>
            <li>🌿 节约用水用电，减少浪费</li>
            <li>🌍 垃圾分类，减少塑料使用</li>
            <li>🚶 多步行、多骑车、少开车</li>
            <li>🌳 爱护动植物，保护生态平衡</li>
            <li>♻️ 支持环保产品和绿色能源</li>
        </ul>
        <a href="#" class="btn">加入环保行动</a>
    </section>

    <section>
        <h2>环保，从今天开始</h2>
        <p>
            每一个小小的改变，都会为地球带来希望。
            让我们携手行动，为子孙后代留下一个更美好的世界。
        </p>
    </section>
</main>
